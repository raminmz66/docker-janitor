[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "docker-janitor"
version = "0.1.0"
description = "Lightweight Linux desktop indicator for previewing and safely cleaning Docker disk space."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Ramin Maazallahi", email = "r.mazallahi-ext@initiative-crm.com" }
]
keywords = [
    "docker",
    "janitor",
    "cleanup",
    "disk-space",
    "indicator",
    "appindicator",
    "tray",
    "gtk3",
    "linux",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Gnome",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/raminmz66/docker-janitor"
Repository = "https://github.com/raminmz66/docker-janitor"
Issues = "https://github.com/raminmz66/docker-janitor/issues"

[project.scripts]
docker-janitor = "docker_janitor:main"

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E402",  # Module level import not at top of file (required for gi.require_version)
]
